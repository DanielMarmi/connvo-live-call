
<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connvo Live Dialer</title>
<style>
:root{
  font-family:Arial,sans-serif;
  color:#10213c;
  background:#f3f6fc
}
*{box-sizing:border-box}
body{margin:0;padding:24px}
.shell{
  max-width:850px;
  margin:5vh auto;
  background:#fff;
  border:1px solid #e3e9f3;
  border-radius:24px;
  padding:32px;
  box-shadow:0 20px 60px #12234c12
}
.head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center
}
.brand{font-size:25px;font-weight:750}
.sub{color:#7a8aa4;margin-top:8px;font-size:14px}
.pill{
  border-radius:30px;
  background:#eef3fa;
  color:#637895;
  padding:9px 15px;
  font-size:13px
}
.waiting{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:340px;
  text-align:center
}
.pulse{
  height:100px;
  width:100px;
  border-radius:50%;
  background:#e9f1ff;
  display:grid;
  place-items:center;
  position:relative;
  margin-bottom:20px
}
.pulse:before,.pulse:after{
  content:'';
  position:absolute;
  inset:-12px;
  border:2px solid #3982e5;
  border-radius:50%;
  animation:ring 2.4s ease-out infinite;
  opacity:0
}
.pulse:after{animation-delay:1.2s}
.pulse span{font-size:36px;color:#2064cf}
@keyframes ring{
  0%{transform:scale(.65);opacity:.7}
  100%{transform:scale(1.65);opacity:0}
}
h1{font-size:26px;margin:0 0 10px}
.muted{color:#7a8aa4}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:28px
}
.field{
  padding:22px;
  background:#f3f6fb;
  border-radius:14px;
  min-width:0
}
.field small{
  display:block;
  color:#7a8aa4;
  margin-bottom:9px
}
.field strong{
  font-size:20px;
  overflow-wrap:anywhere
}
.active{display:none}
.live .active{display:block}
.live .waiting{display:none}
.live #status{
  background:#e3f8eb;
  color:#087c48
}
.foot{
  margin-top:26px;
  padding-top:17px;
  border-top:1px solid #edf1f6;
  font-size:12px;
  color:#8290a5
}
.error{color:#b45309}
@media(max-width:550px){
  body{padding:10px}
  .shell{padding:20px}
  .grid{grid-template-columns:1fr}
  .brand{font-size:20px}
}
</style>
</head>
<body>

<main class="shell" id="shell">
  <div class="head">
    <div>
      <div class="brand">Connvo · Live Dialer</div>
      <div class="sub">כרטיס לקוח בזמן אמת</div>
    </div>
    <span class="pill" id="status">ממתין לשיחה</span>
  </div>

  <section class="waiting">
    <div class="pulse"><span>☎</span></div>
    <h1>ממתין לשיחה הבאה</h1>
    <div class="muted">
      פרטי הלקוח יופיעו כאן עם תחילת השיחה
    </div>
  </section>

  <section class="active">
    <div class="grid">
      <div class="field">
        <small>שם הלקוח</small>
        <strong id="name">—</strong>
      </div>
      <div class="field">
        <small>מספר טלפון</small>
        <strong id="phone">—</strong>
      </div>
      <div class="field">
        <small>נציג</small>
        <strong id="agent">—</strong>
      </div>
      <div class="field">
        <small>שלוחה / יעד</small>
        <strong id="extension">—</strong>
      </div>
      <div class="field">
        <small>תור</small>
        <strong id="queue">—</strong>
      </div>
      <div class="field">
        <small>משך שיחה</small>
        <strong id="duration">00:00</strong>
      </div>
    </div>
  </section>

  <div class="foot" id="connection">
    ממתין לחיבור נתונים מאומת
  </div>
</main>

<script>
const shell=document.getElementById('shell');
const get=id=>document.getElementById(id);

let startedAt=null;
let lastCallId=null;

function renderCall(payload){
  if(!payload||typeof payload!=='object')return;

  const d=payload.custom_attributes||payload;
  const status=String(
    d.dialer_status||d.status||''
  ).toUpperCase();

  const callId=String(
    d.dialer_callid||d.callid||''
  );

  if([
    'COMPLETECALLER',
    'COMPLETEAGENT',
    'HANGUP',
    'ENDED',
    'DISCONNECT'
  ].includes(status)){
    if(!lastCallId||!callId||callId===lastCallId){
      setTimeout(()=>{
        shell.classList.remove('live');
        get('status').textContent='ממתין לשיחה';
        startedAt=null;
      },3000);
    }
    return;
  }

  if(status!=='CONNECT'&&status!=='ANSWER')return;

  lastCallId=callId||lastCallId;
  startedAt=Date.now();

  get('name').textContent=
    d.dialer_customer_name||
    d.customer_name||
    d.dialer_phone||
    d.phone||'לקוח';

  get('phone').textContent=
    d.dialer_phone||d.phone||'—';

  get('agent').textContent=
    d.agent_name||'—';

  get('extension').textContent=
    d.dialer_extension||d.extension||'—';

  get('queue').textContent=
    d.dialer_queue||d.queue||'—';

  get('status').textContent='שיחה פעילה';
  shell.classList.add('live');
}

setInterval(()=>{
  if(!startedAt)return;
  const s=Math.floor((Date.now()-startedAt)/1000);

  get('duration').textContent=
    String(Math.floor(s/60)).padStart(2,'0')+
    ':'+
    String(s%60).padStart(2,'0');
},1000);

window.addEventListener('message',e=>{
  if(e.origin!=='https://app.connvo.com')return;

  const d=e.data;

  if(d?.event==='appContext'){
    const c=d.data?.conversation;
    if(c?.id){
      get('connection').textContent=
        'Conversation '+c.id+
        ' · ממתין לערוץ עדכונים';
    }
  }
});

if(window.parent!==window){
  window.parent.postMessage(
    'chatwoot-dashboard-app:fetch-info',
    'https://app.connvo.com'
  );
}
</script>
</body>
</html>
