<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connvo Live Dialer Demo</title><style>body{font-family:Arial,sans-serif;background:#f3f6fc;color:#10213c;margin:0;padding:24px}.card{max-width:720px;margin:20px auto;background:white;border:1px solid #e2e8f0;border-radius:18px;padding:25px;box-shadow:0 12px 30px #10213c12}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{background:#e6f8ed;color:#087c48;padding:8px 12px;border-radius:25px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.field{background:#f2f5fa;padding:17px;border-radius:12px}.field small{display:block;color:#74819b;margin-bottom:8px}.field strong{font-size:18px}button{background:#155ce0;color:white;border:0;border-radius:10px;padding:13px 18px;cursor:pointer;font-weight:bold}.muted{color:#72819b;font-size:13px}.status{background:#edf2fa;padding:13px;border-radius:10px;font-size:13px;margin-top:18px}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body><div class="card"><div class="top"><div><h2>Connvo · Live Dialer</h2><p class="muted">סימולציה של חמש שיחות נכנסות</p></div><span class="tag" id="state">ממתין לשיחה</span></div><div class="grid"><div class="field"><small>שם לקוח</small><strong id="name">ממתין ללקוח</strong></div><div class="field"><small>טלפון</small><strong id="phone">—</strong></div><div class="field"><small>קמפיין</small><strong id="campaign">—</strong></div><div class="field"><small>נציג</small><strong id="agent">—</strong></div><div class="field"><small>מספר שיחה</small><strong id="count">0 / 5</strong></div><div class="field"><small>תוצאת שיחה</small><strong id="result">—</strong></div></div><button id="start">הפעל 5 שיחות אוטומטיות</button><button id="next">שיחה הבאה</button><div class="status" id="log">מוכן לבדיקה בתוך Connvo</div></div><script>const calls=[{name:"ישראל ישראלי",phone:"050-1234567",campaign:"לידים נובמבר",result:"נענה"},{name:"מיכל כהן",phone:"052-2345678",campaign:"לידים נובמבר",result:"נענה"},{name:"אבי לוי",phone:"054-3456789",campaign:"לקוחות חוזרים",result:"נענה"},{name:"דנה אברהם",phone:"053-4567890",campaign:"לידים נובמבר",result:"נענה"},{name:"רועי מזרחי",phone:"050-5678901",campaign:"לקוחות חוזרים",result:"נענה"}];let i=0,timer=null;const el=id=>document.getElementById(id);function show(){const c=calls[i%calls.length];el("name").textContent=c.name;el("phone").textContent=c.phone;el("campaign").textContent=c.campaign;el("result").textContent=c.result;el("count").textContent=(i%calls.length+1)+" / 5";el("state").textContent="שיחה פעילה";el("log").textContent="עודכן אוטומטית: "+new Date().toLocaleTimeString("he-IL");i++}el("next").onclick=show;el("start").onclick=()=>{clearInterval(timer);i=0;show();let n=1;timer=setInterval(()=>{if(n>=5){clearInterval(timer);el("state").textContent="הסימולציה הסתיימה";return}show();n++},2200)};window.addEventListener("message",e=>{if(e.data&&e.data.event==="appContext"){const a=e.data.data?.conversation?.meta?.assignee;el("agent").textContent=a?.name||"נציג לא זוהה"}});window.parent?.postMessage("chatwoot-dashboard-app:fetch-info","*");</script></body></html>
